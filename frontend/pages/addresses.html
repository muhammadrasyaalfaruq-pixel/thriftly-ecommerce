<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alamat Pengiriman - Thriftly</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body data-root="../">
  <div id="navbar"></div>

  <main class="container">
    <h1 class="page-title">Alamat pengiriman</h1>
    <div class="addr-grid">
      <div id="daftar"><p class="muted">Memuat alamat...</p></div>

      <form class="addr-form" id="form-alamat">
        <h3>Tambah alamat</h3>
        <input class="field" name="recipient_name" placeholder="Nama penerima" required>
        <input class="field" name="phone" placeholder="Nomor HP" required>
        <input class="field" name="street" placeholder="Alamat lengkap (jalan, nomor, RT/RW)" required>
        <input class="field" name="city" placeholder="Kota" required>
        <input class="field" name="province" placeholder="Provinsi" required>
        <input class="field" name="postal_code" placeholder="Kode pos" required>
        <label class="cek"><input type="checkbox" name="is_default"> Jadikan alamat utama</label>
        <div class="form-error" id="err"></div>
        <button class="btn btn-block">Simpan alamat</button>
      </form>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/alamat.js"></script>
</body>
</html>
